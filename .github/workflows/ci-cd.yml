name: Build, push, and deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  maven-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # setup-java's liberica distribution can't select 21.0.13.0.3+5 (it maps to the same
      # semver as 21.0.13.0.2+5), so download the exact eMudhra-fixed build and install it.
      # SHA-256 computed from the tarball after checking it against BellSoft's published SHA-1.
      - name: Download Liberica JDK 21.0.13.0.3+5
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/liberica.tar.gz" "https://github.com/bell-sw/Liberica/releases/download/21.0.13.0.3+5/bellsoft-jdk21.0.13.0.3+5-linux-amd64.tar.gz"
          echo "f6bac5c836223d91525360bfbb2e422b39f8fcebedafbc1adda27945934926da  $RUNNER_TEMP/liberica.tar.gz" | sha256sum -c -
      - uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          jdkFile: ${{ runner.temp }}/liberica.tar.gz
          java-version: 21.0.13
      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
            ${{ runner.os }}-maven-
            ${{ runner.os }}-
      - name: Run maven build
        run: mvn verify
      - uses: actions/upload-artifact@v7.0.0
        with:
          path: target/*.jar
      - name: Sonar Scan
        env:
          SONAR_TOKEN: ${{ secrets.ENTUR_SONAR_PASSWORD }}
          SONAR_PROJECT_NAME: ${{ github.event.repository.name }}
          SONAR_PROJECT_KEY: entur_${{ github.event.repository.name }}
        run: |
          mvn \
                  org.jacoco:jacoco-maven-plugin:prepare-agent verify \
                  org.jacoco:jacoco-maven-plugin:report sonar:sonar \
                  -Dsonar.projectKey=${SONAR_PROJECT_KEY} \
                  -Dsonar.organization=enturas-github \
                  -Dsonar.projectName=${SONAR_PROJECT_NAME} \
                  -Dsonar.host.url=https://sonarcloud.io \
                  -Dsonar.token=${SONAR_TOKEN}
  docker-lint:
    name: Docker-Lint
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  docker-build:
    if: github.repository_owner == 'entur' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [maven-verify, Docker-Lint]
    uses: entur/gha-docker/.github/workflows/build.yml@v1
    with:
      build_artifact_name: artifact
      build_artifact_path: target
  docker-scan:
    name: Docker-Scan
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    secrets: inherit  # Required for central allowlist access
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }} # The name of the image artifact to scan
  docker-push:
    needs: [Docker-Scan]
    uses: entur/gha-docker/.github/workflows/push.yml@v1
    secrets: inherit  # Required for central allowlist access
  dev-deploy:
    name: Dev Deploy
    needs: [docker-push]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: dev
      image: "gibil:${{ needs.docker-push.outputs.image_tag }}"
    secrets: inherit
  approve-tst:
    name: Approve Test Deploy
    needs: [ dev-deploy ]
    runs-on: ubuntu-latest
    environment: Approve
    steps:
      - run: echo "Approved"
  tst-deploy:
    name: Test Deploy
    needs: [ approve-tst, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: tst
      image: "gibil:${{ needs.docker-push.outputs.image_tag }}"
    secrets: inherit
  approve-prd:
    name: Approve Production Deploy
    needs: [ tst-deploy ]
    runs-on: ubuntu-latest
    environment: Approve
    steps:
      - run: echo "Approved"
  prd-deploy:
    name: Production Deploy
    needs: [ approve-prd, docker-push ]
    uses: entur/gha-helm/.github/workflows/deploy.yml@v1
    with:
      environment: prd
      image: "gibil:${{ needs.docker-push.outputs.image_tag }}"
    secrets: inherit
