description:
  en:
    localisedName: Gibil
    shortDescription: Converts Avinor real-time flight data into SIRI-ET and pushes it to subscribers.
    longDescription: >
      Gibil is a real-time adapter for flight data. It polls Avinor's XML feed for the Norwegian domestic airports
      that Avinor tracks, stitches arrival and departure events into unified flight chains, and detects what has
      actually changed since the last poll. Changed flights are matched against NeTEx timetable data to resolve
      the corresponding service journey and line, mapped to SIRI EstimatedVehicleJourneys with airport quay
      identifiers, and pushed as SIRI-ET to registered subscribers, primarily Anshar.
      This gives the Norwegian national journey planner live flight status alongside the planned flight timetables
      produced by Extime. Airports are polled in batches, and subscriptions that keep failing are terminated
      automatically.
    documentation: https://github.com/entur/gibil/blob/main/README.md
    features:
      - Polls the Avinor real-time flight feed
      - Stitches arrival and departure events into unified flights
      - Hash-based change detection between polls
      - Resolves NeTEx service journey and line references
      - Maps flights to SIRI-ET EstimatedVehicleJourneys
      - Push delivery to subscribers with automatic termination on repeated failure

